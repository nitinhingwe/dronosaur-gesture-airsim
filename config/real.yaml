connection:
  device: "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG03FM3C-if00-port0"
  baud: 921600

safety:
  bench_read_only: true
  allow_arm: false
  allow_takeoff: false

control:
  command_interval: 0.10

velocity:
  forward: 0.3
  backward: -0.3
  right: 0.3
  left: -0.3
  up: -0.2
  down: 0.2
  yaw_rate: 10
